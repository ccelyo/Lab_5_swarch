worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 32;
}

http {
    server {
        listen 8080;
        location / {
            default_type application/json;
            return 200 '{"service":"backend","data":"patient-record-001"}';
        }
    }
}
