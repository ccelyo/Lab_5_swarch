# Arnés de pruebas de Andrés (rol 7). No reemplaza el docker-compose del equipo (Kevin / Fabián).
# Topología plana: atacante, gateway, frontend, backend y base comparten una sola red.
# Es el "antes": 443, 8080 y 5432 quedan alcanzables desde el atacante.

name: lab5-seg-before

services:
  attacker:
    build: ./attacker
    init: true
    networks: [flat]

  gateway:
    build: ./gateway
    init: true
    networks: [flat]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS --max-time 3 https://127.0.0.1/ | grep -q patient-record-001"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  frontend:
    build: ./frontend
    init: true
    networks: [flat]

  backend:
    build: ./backend
    init: true
    networks: [flat]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:8080/ | grep -q patient-record-001"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    networks: [flat]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

networks:
  flat:
